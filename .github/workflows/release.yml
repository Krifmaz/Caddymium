name: Release

# Every push to main ships a normal vX.Y.Z release through the kit's shared
# workflows: the next version (PATCH by default; MINOR/MAJOR when the PR adds
# docs/releases/<version>.md, which is then also the notes), the panel image
#   ghcr.io/<owner>/caddymium:<version> and :latest
# and the GitHub release that points at it.
# amd64 only by default: arm64 is built under emulation and costs a lot of
# Actions minutes, so request it explicitly with "Run workflow".
# The Caddy image has its own workflow that only runs when caddy/ changes.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        default: linux/amd64
        type: choice
        options: [linux/amd64, "linux/amd64,linux/arm64"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.0
    with:
      stage: prepare
      app-name: Caddymium

  docker:
    needs: prepare
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.2.0
    with:
      image: caddymium
      version: ${{ needs.prepare.outputs.version }}
      platforms: ${{ inputs.platforms || 'linux/amd64' }}
      build-args: |
        VERSION=v${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, docker]
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.0
    with:
      stage: publish
      app-name: Caddymium
      version: ${{ needs.prepare.outputs.version }}
      notes: |
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/caddymium"
        { printf '\n## Image\n\n```yaml\nimage: %s:%s\n```\n' "$image" "$V"; } >> "$NOTES"
