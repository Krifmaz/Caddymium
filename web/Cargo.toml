# Caddymium's web app on the Krifmaz kit: Leptos (client-side, WebAssembly), the kit's components and its
# Encore theme, built by trunk and embedded into the panel's binary. A Cargo workspace of its own.
[workspace]
resolver = "2"

[package]
name = "caddymium-web"
description = "Caddymium's web app."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The kit, pinned to the same tag as backend/Cargo.toml.
[dependencies]
kit-leptos = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.1" }
kit-rules = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.1" }
leptos = { version = "=0.8.23", features = ["csr"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlElement", "Url", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "MediaQueryList", "Storage", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
